<title>موقع أحمد الشخصي</title>

<style>
body{
    margin:0;
    font-family:Tahoma, Arial;
    background: linear-gradient(135deg,#0f172a,#020617,#000);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.card{
    width:92%;
    max-width:420px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(18px);
    border-radius:22px;
    padding:22px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,255,255,0.15);
}

h1{
    font-size:28px;
    margin-bottom:8px;
    background: linear-gradient(90deg,#00e5ff,#ff00ff,#00ff88);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.bio{
    margin:12px 0 18px;
    padding:10px;
    border-radius:12px;
    background: rgba(0,255,255,0.08);
    color:#00e5ff;
    font-weight:bold;
}

p{
    color:#cbd5e1;
    font-size:14px;
}

.links a{
    display:block;
    margin:10px 0;
    padding:12px;
    border-radius:12px;
    text-decoration:none;
    color:white;
    background: rgba(255,255,255,0.08);
    transition:0.3s;
    font-weight:bold;
}

.links a:hover{
    transform:scale(1.05);
    background: linear-gradient(90deg,#00e5ff,#ff00ff);
}

.youtube{
    background: linear-gradient(90deg,#ff0000,#ff4d4d) !important;
}

.footer{
    margin-top:15px;
    font-size:12px;
    color:#94a3b8;
}
</style>
</head>
